<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudPrinter Quotation Generation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/5.1.1/marked.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #007bff;
            color: white;
            padding: 15px;
            font-size: 1.5rem;
        }
        #header-title {
            text-align: center;
            flex-grow: 1;
        }
        #login-btn {
            background-color: #45a049;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        #login-btn:hover {
            background-color: #3d8b3d;
        }
        #login-btn.logged-in {
            background-color: #28a745;
            cursor: default;
        }
        .auth-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .auth-modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 5px;
            width: 300px;
            text-align: center;
        }
        .token-info {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            text-align: left;
            font-size: 0.8rem;
            display: none;
        }
        .token-field {
            word-break: break-all;
            margin-bottom: 5px;
        }
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: 800px;
            margin: auto;
            width: 100%;
            height: 100%;
            padding: 10px;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #fff;
            border-radius: 5px;
        }
        .message {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .message img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .user-message {
            justify-content: flex-end;
        }
        .bot-message {
            justify-content: flex-start;
        }
        .bot-response, .user-response {
            padding: 10px;
            border-radius: 5px;
            max-width: 75%;
            word-wrap: break-word;
        }
        .bot-response {
            background-color: #e0f7fa;
        }
        .user-response {
            background-color: #c8e6c9;
            align-self: flex-end;
        }
        #input-container {
            display: flex;
            padding: 10px;
            background-color: white;
            border-top: 1px solid #ccc;
        }
        #user-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #send-button {
            padding: 10px 15px;
            margin-left: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        #send-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="header">
        <div id="header-title">CloudPrinter Quotation Generation</div>
        <button id="login-btn">Login</button>
    </div>

    <div class="auth-modal" id="auth-modal">
        <div class="auth-modal-content">
            <h3>Authentication Success</h3>
            <p>You are now logged in to CloudPrinter!</p>
            <div class="token-info" id="token-info">
                <div class="token-field"><strong>Access Token:</strong> <span id="access-token">None</span></div>
                <div class="token-field"><strong>Expires In:</strong> <span id="expires-in">None</span></div>
            </div>
            <button id="close-auth-modal">Close</button>
        </div>
    </div>

    <div id="chat-container">
        <div id="messages"></div>
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Type a message..." />
            <button id="send-button">Send</button>
        </div>
    </div>
    <script>
        const socket = io();
        let authToken = null;

        window.onload = () => {
            addMessage("What can I help you with today?", "bot");

        // Check if we're already authenticated
        fetch('/check_token')
                .then(response => response.json())
                .then(data => {
                    if (data.authenticated) {
                        authToken = data.access_token;
                        updateLoginButton(true);
                    }
                })
                .catch(error => console.error('Error checking token:', error));
        };

        document.getElementById('login-btn').addEventListener('click', function() {
            if (!authToken) {
                startOAuth();
            }
        });

        document.getElementById('close-auth-modal').addEventListener('click', function() {
            document.getElementById('auth-modal').style.display = 'none';
        });

        function startOAuth() {
            // Open popup window for authentication
            var width = 600;
            var height = 700;
            var left = (screen.width/2)-(width/2);
            var top = (screen.height/2)-(height/2);
            
            var authWindow = window.open(
                "/auth", 
                "CloudprinterAuth",
                `width=${width},height=${height},left=${left},top=${top}`
            );
            
            // Poll for token data
            var checkInterval = setInterval(function() {
                fetch('/check_token')
                    .then(response => response.json())
                    .then(data => {
                        if (data.authenticated) {
                            clearInterval(checkInterval);
                            // Update authentication state
                            authToken = data.access_token;
                            updateLoginButton(true);
                            
                            // Show success modal
                            document.getElementById('access-token').textContent = 
                                data.access_token.substring(0, 10) + '...';
                            document.getElementById('expires-in').textContent = 
                                data.expires_in || 'Not provided';
                            document.getElementById('token-info').style.display = 'block';
                            document.getElementById('auth-modal').style.display = 'block';
                            
                            // Close the popup
                            if (authWindow && !authWindow.closed) {
                                authWindow.close();
                            }
                        }
                    })
                    .catch(error => console.error('Error checking token:', error));
            }, 1000);
            
            // Backup check in case the popup is closed before authentication
            var popupCheckInterval = setInterval(function() {
                if (authWindow && authWindow.closed) {
                    clearInterval(popupCheckInterval);
                    clearInterval(checkInterval);
                }
            }, 500);
        }

        function updateLoginButton(isLoggedIn) {
            const loginBtn = document.getElementById('login-btn');
            if (isLoggedIn) {
                loginBtn.textContent = "Logged In";
                loginBtn.classList.add('logged-in');
            } else {
                loginBtn.textContent = "Login";
                loginBtn.classList.remove('logged-in');
            }
        }

        socket.on('message', function(data) {
            addMessage(data.content, data.sender === 'the_human' ? 'user' : 'bot');
        });

        document.getElementById('send-button').onclick = function() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (message) {
                socket.emit('user_message', { message: message });
                input.value = '';
            }
        };

        document.getElementById('user-input').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                document.getElementById('send-button').click();
            }
        });

        function addMessage(message, sender) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', `${sender}-message`);

            const img = document.createElement('img');
            img.src = sender === 'user' ? 'static/user.png' : 'static/agent.png';
            messageDiv.appendChild(img);

            const textDiv = document.createElement('div');
            textDiv.classList.add(sender === 'user' ? 'user-response' : 'bot-response');
            textDiv.innerHTML = marked.parse(message);
            messageDiv.appendChild(textDiv);

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
