<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudPrinter Quotation Generation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/5.1.1/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* Prevent body scrolling */
        }
        #header {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #007bff;
            color: white;
            padding: 15px;
            font-size: 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        #header-title {
            text-align: center;
            flex-grow: 1;
        }
        #login-btn {
            background-color: #45a049;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        #login-btn:hover {
            background-color: #3d8b3d;
        }
        #login-btn.logged-in {
            background-color: #28a745;
            cursor: default;
        }
        .auth-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .auth-modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 5px;
            width: 300px;
            text-align: center;
        }
        .token-info {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            text-align: left;
            font-size: 0.8rem;
            display: none;
        }
        .token-field {
            word-break: break-all;
            margin-bottom: 5px;
        }
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: 800px;
            margin: auto;
            width: 100%;
            height: calc(100vh - 70px); /* Subtract header height */
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden; /* Prevent chat container from scrolling */
        }
        #messages {
            flex: 1;
            overflow-y: auto; /* Only the messages area scrolls */
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #fff;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .message {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .message img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .user-message {
            justify-content: flex-end;
        }
        .bot-message {
            justify-content: flex-start;
        }
        .bot-response, .user-response {
            padding: 10px;
            border-radius: 5px;
            max-width: 75%;
            word-wrap: break-word;
        }
        .bot-response {
            background-color: #e0f7fa;
        }
        .user-response {
            background-color: #c8e6c9;
            align-self: flex-end;
        }
        #input-container {
            display: flex;
            padding: 10px;
            background-color: white;
            border-top: 1px solid #ccc;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }
        #user-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #send-button {
            padding: 10px 15px;
            margin-left: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        #send-button:hover {
            background-color: #0056b3;
        }
        #upload-button {
            padding: 10px 12px;
            margin-left: 10px;
            border: none;
            border-radius: 5px;
            background-color: #28a745;
            color: white;
            cursor: pointer;
        }
        #upload-button:hover {
            background-color: #218838;
        }
        #file-input {
            display: none;
        }
        .file-info {
            margin-top: 5px;
            font-size: 0.85rem;
            color: #555;
        }
        .upload-success {
            color: #28a745;
            margin-top: 5px;
            font-size: 0.85rem;
        }
        #chat-login-btn {
            padding: 10px 15px;
            margin-left: 10px;
            border: none;
            border-radius: 5px;
            background-color: #45a049;
            color: white;
            cursor: pointer;
            display: none; /* Hidden by default */
        }
        #chat-login-btn:hover {
            background-color: #3d8b3d;
        }
    </style>
</head>
<body>
    <div id="header">
        <div id="header-title">CloudPrinter Quotation Generation</div>
    </div>

    <div class="auth-modal" id="auth-modal">
        <div class="auth-modal-content">
            <h3>Authentication Success</h3>
            <p>You are now logged in to CloudPrinter!</p>
            <div class="token-info" id="token-info">
                <div class="token-field"><strong>Access Token:</strong> <span id="access-token">None</span></div>
                <div class="token-field"><strong>Expires In:</strong> <span id="expires-in">None</span></div>
            </div>
            <button id="close-auth-modal">Close</button>
        </div>
    </div>

    <div id="chat-container">
        <div id="messages"></div>
        <div class="file-info" id="file-info"></div>
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Type a message..." />
            <button id="upload-button" title="Upload PDF"><i class="fas fa-plus"></i></button>
            <input type="file" id="file-input" accept=".pdf" />
            <button id="chat-login-btn">Login</button>
            <button id="send-button">Send</button>
        </div>
    </div>
    <script>
        const socket = io();
        let authToken = null;
        let uploadedFilePath = null;
        let loginSuggested = false;
        let botResponding = false; // Track if bot is currently responding

        window.onload = () => {
            addMessage("What can I help you with today?", "bot");

        // Check if we're already authenticated
        fetch('/check_token')
                .then(response => response.json())
                .then(data => {
                    if (data.authenticated) {
                        authToken = data.access_token;
                        updateLoginButton(true);
                    }
                })
                .catch(error => console.error('Error checking token:', error));
        };

        // Function to toggle input controls based on bot response status
        function toggleInputControls(disable) {
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const uploadButton = document.getElementById('upload-button');
            
            userInput.disabled = disable;
            sendButton.disabled = disable;
            uploadButton.disabled = disable;
            
            if (disable) {
                userInput.placeholder = "Waiting for response...";
                sendButton.style.opacity = "0.6";
                uploadButton.style.opacity = "0.6";
            } else {
                userInput.placeholder = "Type a message...";
                sendButton.style.opacity = "1";
                uploadButton.style.opacity = "1";
            }
        }

        document.getElementById('chat-login-btn').addEventListener('click', function() {
            if (!authToken) {
                startOAuth();
            }
        });

        document.getElementById('close-auth-modal').addEventListener('click', function() {
            document.getElementById('auth-modal').style.display = 'none';
        });

        // Handle file upload button click
        document.getElementById('upload-button').addEventListener('click', function() {
            document.getElementById('file-input').click();
        });

        // Handle file selection
        document.getElementById('file-input').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                if (file.type !== 'application/pdf') {
                    alert('Please select a PDF file.');
                    return;
                }

                const formData = new FormData();
                formData.append('file', file);

                fetch('/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.file_path) {
                        uploadedFilePath = data.file_path;
                        document.getElementById('file-info').innerHTML = 
                            `<div class="upload-success">File uploaded: ${file.name}</div>`;
                        // Auto-send message to bot that user is logged in
                        socket.emit('user_message', { 
                        message: "File Uploaded Successfully.",
                        is_system_message: true
                    });
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while uploading the file.');
                });
            }
        });

        function startOAuth() {
            // Open popup window for authentication
            var width = 600;
            var height = 700;
            var left = (screen.width/2)-(width/2);
            var top = (screen.height/2)-(height/2);
            
            var authWindow = window.open(
                "/auth", 
                "CloudprinterAuth",
                `width=${width},height=${height},left=${left},top=${top}`
            );
            
            // Poll for token data
            var checkInterval = setInterval(function() {
                fetch('/check_token')
                    .then(response => response.json())
                    .then(data => {
                        if (data.authenticated) {
                            clearInterval(checkInterval);
                            // Update authentication state
                            authToken = data.access_token;
                            updateLoginButton(true);
                            
                            // Show success modal
                            document.getElementById('access-token').textContent = 
                                data.access_token.substring(0, 10) + '...';
                            document.getElementById('expires-in').textContent = 
                                data.expires_in || 'Not provided';
                            document.getElementById('token-info').style.display = 'block';
                            document.getElementById('auth-modal').style.display = 'block';
                            
                            // Auto-send message to bot that user is logged in
                            socket.emit('user_message', { 
                                message: "Logged In Successfully.",
                                is_system_message: true
                            });
                            
                            // Close the popup
                            if (authWindow && !authWindow.closed) {
                                authWindow.close();
                            }
                        }
                    })
                    .catch(error => console.error('Error checking token:', error));
            }, 1000);
            
            // Backup check in case the popup is closed before authentication
            var popupCheckInterval = setInterval(function() {
                if (authWindow && authWindow.closed) {
                    clearInterval(popupCheckInterval);
                    clearInterval(checkInterval);
                }
            }, 500);
        }

        function updateLoginButton(isLoggedIn) {
            const chatLoginBtn = document.getElementById('chat-login-btn');
            
            if (isLoggedIn) {
                chatLoginBtn.style.display = 'none';
                loginSuggested = false;
            } else {
                // Only show the chat login button if login was suggested in the conversation
                if (loginSuggested) {
                    chatLoginBtn.style.display = 'block';
                }
            }
        }

        socket.on('message', function(data) {
            const content = data.content;
            addMessage(content, data.sender === 'the_human' ? 'user' : 'bot');
            
            // Re-enable input controls when receiving a bot response
            if (data.sender !== 'the_human' && botResponding) {
                botResponding = false;
                toggleInputControls(false);
            }
            
            // Check if the message requires login
            if (data.sender !== 'the_human' && data.login_required === true) {
                loginSuggested = true;
                if (!authToken) { // Only show if not already logged in
                    document.getElementById('chat-login-btn').style.display = 'block';
                }
            }
        });

        document.getElementById('send-button').onclick = function() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (message) {
                socket.emit('user_message', { message: message });
                input.value = '';
                
                // Disable input controls while waiting for bot response
                botResponding = true;
                toggleInputControls(true);
            }
        };

        document.getElementById('user-input').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                document.getElementById('send-button').click();
            }
        });

        function addMessage(message, sender) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', `${sender}-message`);

            const img = document.createElement('img');
            img.src = sender === 'user' ? 'static/user.png' : 'static/agent.png';
            messageDiv.appendChild(img);

            const textDiv = document.createElement('div');
            textDiv.classList.add(sender === 'user' ? 'user-response' : 'bot-response');
            textDiv.innerHTML = marked.parse(message);
            messageDiv.appendChild(textDiv);

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
